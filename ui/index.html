<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>OpenTypeless</title><style>body{font:15px system-ui;margin:24px;color:#222}button{padding:9px 16px;border:0;border-radius:8px;background:#1769e0;color:white;font-size:15px}button.recording{background:#d33}button.secondary{background:#666;margin-left:8px}#status{margin:16px 0;color:#666;min-height:20px}.mic{display:inline-flex;align-items:center;gap:7px;margin:12px 0 2px;color:#666}.dot{width:10px;height:10px;border-radius:50%;background:#aaa}.dot.starting{background:#f0ad00;box-shadow:0 0 0 4px #fff1c2}.dot.ready{background:#22a447;box-shadow:0 0 0 4px #d9f5e2}.dot.error{background:#d33;box-shadow:0 0 0 4px #ffdede}small{color:#888}section{border-top:1px solid #ddd;margin-top:22px;padding-top:14px}label{display:block;margin:8px 0 5px}input{width:100%;box-sizing:border-box;padding:8px;border:1px solid #bbb;border-radius:6px;font:14px monospace}</style></head><body><h2>OpenTypeless</h2><p>按 <b id="shortcut-hint">Command+Shift+Space</b> 开始和停止录音</p><button id="toggle">开始录音</button><div class="mic"><span id="mic-dot" class="dot"></span><span id="mic-label">麦克风未启动</span></div><div id="status">就绪</div><small>停止后会自动上传并粘贴识别结果。</small><section><b>设置</b><label for="shortcut">语音输入快捷键</label><input id="shortcut" placeholder="例如 Command+Shift+Space"><button class="secondary" id="save">保存设置</button></section><script type="module" src="./main.js"></script></body></html>
