name: Desktop build

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-14
            target: aarch64-apple-darwin
            bundles: dmg
            artifact: macos-arm64
          - name: macOS Intel
            runner: macos-14
            target: x86_64-apple-darwin
            bundles: dmg
            artifact: macos-x64
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            artifact: windows-x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: tauri-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri-client/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-client
          key: ${{ matrix.target }}
      - run: npm ci
      - name: Generate platform icons from SVG
        run: npm run generate:icons
      - name: Build installers
        run: npm run tauri build -- --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: open-typeless-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            tauri-client/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            tauri-client/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            tauri-client/target/${{ matrix.target }}/release/bundle/msi/*.msi
